<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Filled from the locale at startup. -->
    <meta name="apple-mobile-web-app-title" content="" id="apple-title" />
    <title>Seatroll</title>
    <link rel="manifest" href="locales/zh-CN.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <button
        type="button"
        class="topbar-back"
        id="back-button"
        hidden
        data-i18n-aria-label="nav.back"
      >
        ‹
      </button>
      <h1 class="topbar-title" id="page-title"></h1>
      <button type="button" class="topbar-action" id="class-button" hidden></button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar" hidden>
      <a href="#/checkin" data-tab="checkin">
        <span class="tab-icon" aria-hidden="true">✓</span><span data-i18n="tab.checkin"></span>
      </a>
      <a href="#/seats" data-tab="seats">
        <span class="tab-icon" aria-hidden="true">▦</span><span data-i18n="tab.seats"></span>
      </a>
      <a href="#/leaves" data-tab="leaves">
        <span class="tab-icon" aria-hidden="true">✎</span><span data-i18n="tab.leaves"></span>
      </a>
      <a href="#/report" data-tab="report">
        <span class="tab-icon" aria-hidden="true">≡</span><span data-i18n="tab.report"></span>
      </a>
      <a href="#/settings" data-tab="settings">
        <span class="tab-icon" aria-hidden="true">⚙</span><span data-i18n="tab.settings"></span>
      </a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
